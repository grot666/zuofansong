name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Syntax check
        run: for f in $(git ls-files '*.js'); do node --check "$f" || exit 1; done
      - name: Unit tests
        run: node --test --test-concurrency=1 test/
